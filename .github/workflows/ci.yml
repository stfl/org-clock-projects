name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Emacs ${{ matrix.emacs-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Released builds carried as such by nix-emacs-ci, which is where
        # purcell/setup-emacs installs from, every one of them gating.  "29.4"
        # is the newest of the 29 series the Eask floor names and "31.1" the
        # newest release, so the range is covered at both ends, with "30.2"
        # between them.
        #
        # None of the three is repetition: they disagree about whether
        # warnings.el is preloaded, and the suites' warning capture is
        # sensitive to that, so a test can pass on one and fail on another.
        emacs-version:
          - "29.4"
          - "30.2"
          - "31.1"

    steps:
      - uses: actions/checkout@v6

      - name: Install Emacs ${{ matrix.emacs-version }}
        uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Install Eask
        uses: emacs-eask/setup-eask@master
        with:
          version: snapshot

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: eask install-deps

      - name: Byte-compile
        run: just build

      - name: Lint
        run: just lint

      - name: Run ERT tests
        run: just test
